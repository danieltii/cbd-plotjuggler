FunctionEditorWidget.recentSnippetsXML="@ByteArray(<snippets>\n  <snippet name=\"arcsin_lateral_deg\">\n    <global></global>\n    <function>-- Inputs\npair_offset = 38\npair_scale  = 1.507\n\n-- y = raw measured angle\ny = value\n\n-- Apply arcsin model equivalent:\nnumerator = (y - pair_offset) / 180.0\nresult = math.asin(numerator) * pair_scale\n\n-- Transform angle convention:\n--  * RFS team convention is, from the PoV of the UAV/Sensor, target (+) down (+) RIGHT\nresult = - result\n\nreturn result</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"arcsin_longitudinal_deg\">\n    <global></global>\n    <function>-- Inputs\npair_offset = -28\npair_scale  = 1.4\n\n-- y = raw measured angle\ny = value\n\n-- Apply arcsin model equivalent:\nnumerator = (y + pair_offset) / 180.0\nresult = math.asin(numerator) * pair_scale\n\nreturn result</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"arctanh_lateral_deg\">\n    <global></global>\n    <function>a = 117.0450\nb = 0.0223\nc = -2.3400\nd = -10.690\ne = 145.0000\ny = value\n\n-- Wrap to have always a positive value\ny = (y + 360.0) % 360.0\n\n-- Apply model:\n--  * Remove + 180 term if using center_of_mass_position or pair_angle_deg fields\n--  * Leave + 180 term if using angle_index field\nnumerator = ((y + e + 180.0) % 360.0) - 180.0 - d\ntanh_arg = numerator / a\natanh = 0.5 * math.log((1 + tanh_arg) / (1 - tanh_arg))\nalpha = (1.0 / b) * atanh + c\n\n-- Transform angle convention:\n--  * DERC convention is, from the PoV of the UAV/Sensor, target (+) down (+) LEFT\n--  * RFS team convention is, from the PoV of the UAV/Sensor, target (+) down (+) RIGHT\nalpha = - alpha\n\nreturn alpha</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"arctanh_longitudinal_deg\">\n    <global></global>\n    <function>a = 125.59100\nb = 0.02040\nc = 2.13900\nd = 6.35300\ne = 151.000\ny = value\n\n-- Wrap to have always a positive value\ny = (y + 360.0) % 360.0\n\n-- Apply model:\n--  * Remove + 180 term if using center_of_mass_position or pair_angle_deg fields\n--  * Leave + 180 term if using angle_index field\nnumerator = ((y + e + 180.0) % 360.0) - 180.0 - d\ntanh_arg = numerator / a\natanh = 0.5 * math.log((1 + tanh_arg) / (1 - tanh_arg))\nalpha = (1.0 / b) * atanh + c\n\nreturn alpha</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"average_two_curves\">\n    <global></global>\n    <function>return (value+v1)/2</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"backward_difference_derivative\">\n    <global>prevX = 0\nprevY = 0\nis_first = true</global>\n    <function>if (is_first) then\n  is_first = false\n  prevX = time\n  prevY = value\nend\n\ndx = time - prevX\ndy = value - prevY\nprevX = time\nprevY = value\n\nreturn dy/dx</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"central_difference_derivative\">\n    <global>firstX = 0\nfirstY = 0\nis_first = true\nsecondX = 0\nsecondY = 0\nis_second = false</global>\n    <function>-- Wait for initial values\nif (is_first) then\n  is_first = false\n  is_second = true\n  firstX = time\n  firstY = value\nend\n\nif (is_second) then\n  is_second = false\n  secondX = time\n  secondY = value\nend\n\n-- Central derivative: dy/dx ~= f(x+delta_x)-f(x-delta_x)/(2*delta_x)\ndx = time - firstX\ndy = value - firstY\n-- Increment\nfirstX = secondX\nfirstY = secondY\nsecondX = time\nsecondY = value\n\nreturn dy/dx</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"groundtruth_rf_error_abs_deg\">\n    <global></global>\n    <function>--- GroundTruth angle (radians)\ngroundtruth_angle_rad = value\n\n--- Sensor angle (radians)\nsensor_angle_rad = v1\n\n--- Sensor angle (degrees)\n--- sensor_angle_rad = v1 / 180.0 * 3.141592653\n\nreturn math.abs((groundtruth_angle_rad - sensor_angle_rad) * 180.0 / 3.141592653)</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"groundtruth_rf_error_signed_deg\">\n    <global></global>\n    <function>--- GroundTruth angle (radians)\ngroundtruth_angle_rad = value\n\n--- Sensor angle (radians)\nsensor_angle_rad = v1\n--- Sensor angle (degrees)\n--- sensor_angle_rad = v1 / 180.0 * 3.141592653\n\nreturn (groundtruth_angle_rad - sensor_angle_rad) * 180 / 3.141592653</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"integral\">\n    <global>prevX = 0\nintegral = 0\nis_first = true</global>\n    <function>if (is_first) then\n  is_first = false\n  prevX = time\nend\n\ndx = time - prevX\nprevX = time\n\nintegral = integral + value*dx\n\nreturn integral</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"linear_piecewise_lateral_deg\">\n    <global></global>\n    <function>-- Params\nlinear_behavior_limit_deg = 15.0\nslope = 2.0\npair_offset = 37.0\npair_scale  = 0.42\n\n-- Get raw value\ny = value\n\n-- Apply linear model\nangle = (y - pair_offset) * pair_scale\n\n-- Trasnform angle convention:\n--  * RFS team convention is, from the PoV of the UAV/Sensor, target (+) down (+) right\nangle = - angle\n\n-- Apply piecewise extremes if needed\n-- sign(x) * ( L + slope * (|x| - L) )\nL = linear_behavior_limit_deg\nif math.abs(angle) > L then\n    sign = (angle &lt; 0 and -1 or 1)\n    return sign * ( L + slope * (math.abs(angle) - L) )\nend\n\nreturn angle</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"linear_piecewise_longitudinal_deg\">\n    <global></global>\n    <function>-- Params\nlinear_behavior_limit_deg = 15.0\nslope = 2.0\npair_offset = -17.0\npair_scale  = 0.305\n\n-- Get raw value\ny = value\n\n-- Apply linear model\nangle = (y + pair_offset) * pair_scale\n\n-- Apply piecewise extremes if needed\n-- sign(x) * ( L + slope * (|x| - L) )\nL = linear_behavior_limit_deg\nif math.abs(angle) > L then\n    sign = (angle &lt; 0 and -1 or 1)\n    return sign * ( L + slope * (math.abs(angle) - L) )\nend\n\nreturn angle</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"quat_to_pitch\">\n    <global></global>\n    <function>w = value\nx = v1\ny = v2\nz = v3\n\ndcm20 = 2 * (x * z - w * y)\n\npitch = math.asin(-dcm20)\n\nreturn pitch</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"quat_to_roll\">\n    <global></global>\n    <function>w = value\nx = v1\ny = v2\nz = v3\n\ndcm21 = 2 * (w * x + y * z)\ndcm22 = w*w - x*x - y*y + z*z\n\nroll = math.atan(dcm21, dcm22)\n\nreturn roll</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"quat_to_yaw\">\n    <global></global>\n    <function>w = value\nx = v1\ny = v2\nz = v3\n\ndcm10 = 2 * (x * y + w * z)\ndcm00 = w*w + x*x - y*y - z*z\n\nyaw = math.atan(dcm10, dcm00)\n\nreturn yaw</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"rad_to_deg\">\n    <global></global>\n    <function>return value*180/3.14159</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"remove_offset\">\n    <global>is_first = true\nfirst_value = 0</global>\n    <function>if (is_first) then\n  is_first = false\n  first_value = value\nend\n\nreturn value - first_value</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"rf_localizer_rssi_max\">\n    <global></global>\n    <function>-- RSSI Max value for Gain Setting Control calculation\n\npair_0_average = (v1 + v2) / 2\npair_1_average = (v3 + v4) / 2\npair_2_average = (v5 + v6) / 2\npair_3_average = (v7 + v8) / 2\n\nreturn math.max(pair_0_average, pair_1_average, pair_2_average, pair_3_average)</function>\n    <linked_source></linked_source>\n  </snippet>\n  <snippet name=\"uav_target_bearing\">\n    <global></global>\n    <function>--- UAV position\nlat1 = v1\nlon1 = v2\n\n--- Target position\nlat2 = v3\nlon2 = v4\n\nif lat1 == nil or lon1 == nil or lat2 == nil or lon2 == nil then\n    return nil\nend\n\ndLon = (lon2 - lon1) * 3.141592653 / 180\nlat1 = lat1 * 3.141592653 / 180\nlat2 = lat2 * 3.141592653 / 180\n\ny = math.sin(dLon) * math.cos(lat2)\nx = math.cos(lat1) * math.sin(lat2) - math.sin(lat1) * math.cos(lat2) * math.cos(dLon)\nheading = math.atan(y, x)\nheading = heading * 180 / 3.141592653\nheading = (heading + 360) % 360\n\nreturn heading</function>\n    <linked_source></linked_source>\n  </snippet>\n</snippets>\n)"
